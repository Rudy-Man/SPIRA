<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        body { background: #23272f; color: #f4f4f4; font-family: 'Poppins', Arial, sans-serif; margin: 0; }
        .container { min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .signin-box { background: #2c2f36; border-radius: 10px; padding: 40px 32px; min-width: 320px; max-width: 90vw; box-shadow: 0 4px 24px #000; display: flex; flex-direction: column; align-items: center; }
        h2 { color: #34ace0; margin-bottom: 18px; }
        .btn { margin-bottom: 16px; padding: 10px 24px; background: #fff; color: #23272f; border: none; border-radius: 4px; font-weight: 600; cursor: pointer; width: 100%; }
        .btn-primary { background: #34ace0; color: #fff; margin-bottom: 0; }
        .or { margin: 12px 0; color: #aaa; }
        input[type='tel'] { padding: 8px; border-radius: 4px; border: 1px solid #444; background: #23272f; color: #f4f4f4; width: 100%; margin-bottom: 12px; }
        .error { color: #e74c3c; font-size: 0.95em; margin-bottom: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="signin-box">
            <h2>Sign In</h2>
            <div id="g_id_signin" style="width:100%; margin-bottom:16px;"></div>
            <div class="or">or</div>
            <input id="phone-input" type="tel" placeholder="Phone number">
            <div id="phone-error" class="error" style="display:none;"></div>
            <button id="phone-signin" class="btn btn-primary">Sign in with Phone</button>
        </div>
    </div>
    <script>
        let isSignedIn = false;
        const phoneSigninBtn = document.getElementById('phone-signin');
        const phoneInput = document.getElementById('phone-input');
        const phoneError = document.getElementById('phone-error');

        window.onload = function() {
            google.accounts.id.initialize({
                client_id: 'YOUR_GOOGLE_CLIENT_ID',
                callback: function(response) {
                    // On successful sign-in
                    localStorage.setItem('isSignedIn', 'true');
                    window.location.href = 'ligo.html';
                }
            });
            google.accounts.id.renderButton(
                document.getElementById('g_id_signin'),
                { theme: 'outline', size: 'large', width: '100%' }
            );
        };
        phoneSigninBtn.addEventListener('click', function() {
            if (phoneInput.value.trim().length >= 8) {
                localStorage.setItem('isSignedIn', 'true');
                window.location.href = 'ligo.html';
            } else {
                phoneError.textContent = 'Enter a valid phone number';
                phoneError.style.display = 'block';
                phoneInput.style.borderColor = '#e74c3c';
            }
        });
    </script>
</body>
</html>
