<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPIRA - Equipment Registration</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>
        :root {
            --primary-color: #4a47a3;
            --secondary-color: #706fd3;
            --accent-color: #34ace0;
            --text-color: #23272f; /* Using dark text for white background sections */
            --bg-color: #23272f; /* Dark background for body */
            --light-gray: #2c2f36; /* Darker grey for some elements */
            --white: #fff;
            --border-color: #444; /* Dark border for dark theme */
            --section-bg: #fff; /* White background for main content sections */
            --section-border: #e6e8fa; /* Light border for white theme sections */
        }
        body {
            font-family: 'Poppins', sans-serif;
            background: var(--bg-color);
            margin: 0;
            color: var(--text-color); /* This applies to body, but content sections override */
        }
        .container {
            max-width: 90%;
            margin: 40px auto;
            background: var(--section-bg); /* White background for the main container */
            border: 2px solid var(--section-border);
            border-radius: 10px;
            box-shadow: 0 2px 12px rgba(44,47,54,0.07);
            display: flex;
            min-height: 600px;
            padding: 0 10px; /* Add horizontal padding */
        }
        .steps-sidebar {
            background: var(--light-gray);
            border-right: 2px solid var(--border-color);
            padding: 32px 0 32px 0;
            width: 120px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 18px;
        }
        .step-btn {
            width: 80px;
            padding: 10px 0;
            background: var(--white);
            color: var(--primary-color);
            border: 2px solid var(--primary-color);
            border-radius: 6px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s, color 0.2s;
            text-align: center;
        }
        .step-btn.active, .step-btn:focus {
            background: var(--primary-color);
            color: var(--white);
        }
        .main-step-content {
            flex: 1;
            padding: 40px 32px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            color: var(--text-color); /* Ensure text is readable on white background */
        }
        .step-title {
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--primary-color);
            margin-bottom: 24px;
            text-align: center;
        }
        .form-group {
            width: 100%;
            max-width: 450px;
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            font-weight: 600;
            color: var(--primary-color);
            margin-bottom: 8px;
        }
        .form-group input[type="text"],
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            font-size: 1rem;
            color: var(--text-color);
            background-color: var(--white);
        }
         .form-group textarea {
            min-height: 150px;
            resize: vertical;
        }
        .upload-box {
            border: 2px dashed var(--primary-color);
            border-radius: 6px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            margin-bottom: 20px;
            color: var(--secondary-color);
        }
        .upload-box i { font-size: 3rem; margin-bottom: 10px; }
        .upload-box input[type="file"] { display: none; }

        .upload-area {
            border: 2px dashed var(--primary-color);
            border-radius: 6px;
            padding: 20px;
            text-align: center;
            margin-bottom: 20px;
            min-height: 100px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
             color: var(--secondary-color);
             cursor: pointer;
        }
        .upload-area.small { min-height: 80px; }

         .upload-area input[type="file"] { display: none; }

        .file-upload-btn {
            background: var(--primary-color);
            color: var(--white);
            border: none;
            border-radius: 4px;
            padding: 8px 18px;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 10px;
        }
         .file-upload-btn:hover { background: var(--secondary-color); }

        .cost-inputs .form-group {
             width: calc(50% - 10px); /* Adjust width for two columns */
             display: inline-block;
             margin-right: 20px;
             vertical-align: top;
        }
        .cost-inputs .form-group:last-child { margin-right: 0; }

        .cost-inputs .form-group label {
            margin-bottom: 4px;
        }
        .cost-inputs .form-group input {
            width: 100%; /* Make input fill the column */
        }

        .finish-btn {
            background: var(--accent-color);
            color: var(--white);
            border: none;
            border-radius: 4px;
            padding: 12px 40px;
            font-weight: 700;
            font-size: 1.2rem;
            cursor: pointer;
            margin-top: 20px;
        }
         .finish-btn:hover { background: #34ace0; opacity: 0.9; }

    </style>
</head>
<body>
    <div class="container">
        <div class="steps-sidebar">
            <button class="step-btn active">Step 1</button>
            <button class="step-btn">Step 2</button>
            <button class="step-btn">Step 3</button>
            <button class="step-btn">Step 4</button>
            <button class="step-btn" onclick="window.location.href='Marketplace.html'" style="width: auto; padding: 10px; margin-top: auto;">Back to Marketplace</button>
        </div>
        <div class="main-step-content" id="step-content">
            <!-- Step 1: Add name, category, description, primary image -->
            <div id="step1">
                <div class="step-title">Add Equipment Details</div>
                <div class="form-group">
                    <label for="equip-name">Name</label>
                    <input type="text" id="equip-name" placeholder="Enter equipment name...">
                </div>
                <div class="form-group">
                    <label for="equip-category">Category</label>
                     <select id="equip-category">
                        <option value="">Select Category</option>
                        <option value="physics">Physics</option>
                        <option value="chemistry">Chemistry</option>
                        <option value="biology">Biology</option>
                        <option value="cs">Computer Science</option>
                        <!-- Add more categories as needed -->
                    </select>
                </div>
                 <div class="form-group">
                    <label>Upload Primary Image (Only 1)</label>
                    <div class="upload-area small">
                        <i class="fas fa-cloud-upload-alt"></i>
                        <span>Click to upload</span>
                        <input type="file" accept="image/*">
                    </div>
                </div>
                <div class="form-group">
                    <label for="equip-description">Description</label>
                    <textarea id="equip-description" placeholder="Describe the equipment..."></textarea>
                </div>
                <button class="submit-btn" onclick="goToStep(2)">Next</button>
            </div>

            <!-- Step 2: Model, Manufacturer, Secondary Images, PDFs -->
            <div id="step2" style="display:none;">
                 <div class="step-title">More Equipment Details</div>
                 <div class="form-group">
                    <label for="model-number">Model Number</label>
                    <input type="text" id="model-number" placeholder="Enter model number...">
                </div>
                <div class="form-group">
                    <label for="manufacturer">Manufacturer</label>
                    <input type="text" id="manufacturer" placeholder="Enter manufacturer...">
                </div>
                <div class="form-group">
                     <label>Upload Secondary Images (upto 4)</label>
                    <div class="upload-area">
                         <i class="fas fa-images"></i>
                        <span>Click to upload (max 4)</span>
                         <input type="file" accept="image/*" multiple>
                    </div>
                 </div>
                 <div class="form-group">
                     <label>Upload Documents</label>
                     <button class="file-upload-btn">Upload Technical Specs</button>
                     <input type="file" accept=".pdf" style="display:none;">
                     <button class="file-upload-btn">Upload Instruction Manual</button>
                      <input type="file" accept=".pdf" style="display:none;">
                     <button class="file-upload-btn">Upload terms and conditions</button>
                      <input type="file" accept=".pdf" style="display:none;">
                 </div>
                 <button class="submit-btn" onclick="goToStep(3)">Next</button>
            </div>

            <!-- Step 3: Safety Requirements -->
            <div id="step3" style="display:none;">
                 <div class="step-title">Safety Requirements</div>
                 <div class="form-group">
                    <label for="safety-requirements">Kindly write the safety requirements</label>
                    <textarea id="safety-requirements" placeholder="Describe safety requirements..."></textarea>
                 </div>
                 <button class="submit-btn" onclick="goToStep(4)">Next</button>
            </div>

            <!-- Step 4: Costs and Finish -->
            <div id="step4" style="display:none;">
                 <div class="step-title">Costs and Registration</div>
                 <div class="cost-inputs">
                    <div class="form-group">
                        <label for="cost-onsite">Equipment Cost: on sight (per hour)</label>
                        <input type="text" id="cost-onsite" placeholder="Enter cost...">
                    </div>
                    <div class="form-group">
                        <label for="cost-remote">Equipment Cost: remote (per hour)</label>
                        <input type="text" id="cost-remote" placeholder="Enter cost...">
                    </div>
                 </div>
                 <button class="finish-btn">Finish Registration</button>
            </div>
        </div>
    </div>
    <script>
        let currentStep = 1;
        const totalSteps = 4;
        const stepButtons = document.querySelectorAll('.step-btn');

        function updateStepUI(step) {
            for (let i = 1; i <= totalSteps; i++) {
                const stepElement = document.getElementById('step' + i);
                if (stepElement) {
                    stepElement.style.display = (i === step) ? '' : 'none';
                }
                if (stepButtons[i - 1]) {
                    stepButtons[i - 1].classList.toggle('active', i === step);
                }
            }
            currentStep = step;
        }

        function goToStep(step) {
            if (step >= 1 && step <= totalSteps) {
                updateStepUI(step);
            }
        }

        stepButtons.forEach((button, index) => {
            button.addEventListener('click', () => {
                goToStep(index + 1);
            });
        });

        // Initial UI setup
        updateStepUI(currentStep);

        // Simple file upload simulation (replace with actual upload logic)
        document.querySelectorAll('.upload-area input[type="file"]').forEach(input => {
            input.closest('.upload-area').addEventListener('click', () => {
                input.click();
            });
            input.addEventListener('change', () => {
                if (input.files.length > 0) {
                    alert('File(s) selected!'); // Replace with visual feedback
                }
            });
        });
         document.querySelectorAll('.file-upload-btn').forEach(button => {
             button.addEventListener('click', () => {
                 // Find the next hidden file input after this button
                 const fileInput = button.nextElementSibling;
                 if (fileInput && fileInput.type === 'file') {
                     fileInput.click();
                 }
             });
         });

    </script>
</body>
</html>
