<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meet the Team</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { background: #23272f; color: #f4f4f4; font-family: 'Poppins', Arial, sans-serif; margin: 0; }
        .container { max-width: 700px; margin: 60px auto; background: #2c2f36; border-radius: 12px; box-shadow: 0 4px 24px #000; padding: 40px 32px; }
        h1 { color: #34ace0; text-align: center; margin-bottom: 32px; }
        .team-list { display: flex; flex-direction: column; gap: 32px; }
        .member { display: flex; align-items: center; gap: 22px; background: #23272f; border-radius: 8px; padding: 18px 20px; box-shadow: 0 2px 8px #222; }
        .avatar { width: 64px; height: 64px; border-radius: 50%; background: #34ace0; color: #23272f; display: flex; align-items: center; justify-content: center; font-size: 2em; font-weight: 700; }
        .info { display: flex; flex-direction: column; }
        .name { font-size: 1.2em; font-weight: 600; color: #f4f4f4; }
        .role { color: #b0b0ff; font-size: 1em; }
        a.btn { display: inline-block; margin: 32px auto 0 auto; background: #34ace0; color: #fff; padding: 12px 32px; border-radius: 6px; font-weight: 600; text-align: center; text-decoration: none; transition: background 0.2s; }
        a.btn:hover { background: #4a47a3; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Meet the Team</h1>
        <div class="team-list">
            <div class="member">
                <div class="avatar">MP</div>
                <div class="info">
                    <div class="name">Manthan Patki</div>
                    <div class="role">Coding</div>
                </div>
            </div>
            <div class="member">
                <div class="avatar">AG</div>
                <div class="info">
                    <div class="name">Advay Giradkar</div>
                    <div class="role">Front-end Development</div>
                </div>
            </div>
            <div class="member">
                <div class="avatar">RK</div>
                <div class="info">
                    <div class="name">Rudra Kandge</div>
                    <div class="role">Coding</div>
                </div>
            </div>
        </div>
        <a href="ligo.html" class="btn">Back to Home</a>
    </div>
</body>
</html>
