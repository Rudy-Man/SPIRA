<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meet the Team</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { background: linear-gradient(160deg,#110820 0%,#07080b 35%,#07080b 65%,#0e0620 100%) fixed; color: #f0ece0; font-family: 'Poppins', Arial, sans-serif; margin: 0; }
        .container { max-width: 700px; margin: 60px auto; background: #0d0e14; border: 1px solid #1a1b28; border-radius: 14px; box-shadow: 0 8px 40px rgba(0,0,0,0.6); padding: 40px 32px; }
        h1 { color: #f0b429; text-align: center; margin-bottom: 32px; }
        .team-list { display: flex; flex-direction: column; gap: 20px; }
        .member { display: flex; align-items: center; gap: 22px; background: #131420; border: 1px solid #1a1b28; border-radius: 10px; padding: 18px 20px; transition: border-color .2s; }
        .member:hover { border-color: #9e7a10; }
        .avatar { width: 64px; height: 64px; border-radius: 50%; background: #f0b429; color: #07080b; display: flex; align-items: center; justify-content: center; font-size: 2em; font-weight: 700; flex-shrink:0; }
        .info { display: flex; flex-direction: column; }
        .name { font-size: 1.1em; font-weight: 700; color: #f0ece0; }
        .role { color: #c890ff; font-size: 0.9em; }
        a.btn { display: inline-block; margin: 32px auto 0 auto; background: #f0b429; color: #07080b; padding: 12px 32px; border-radius: 8px; font-weight: 700; text-align: center; text-decoration: none; transition: opacity .2s; }
        a.btn:hover { opacity: 0.85; }
    </style>
</head>
<body>
    {% include '_flash_toasts.html' %}
    <div class="container">
        <h1>Meet the Team</h1>
        <div class="team-list">
            <div class="member">
                <div class="avatar">MP</div>
                <div class="info">
                    <div class="name">Manthan Patki</div>
                    <div class="role">Coding</div>
                </div>
            </div>
            <div class="member">
                <div class="avatar">AG</div>
                <div class="info">
                    <div class="name">Advay Giradkar</div>
                    <div class="role">Front-end Development</div>
                </div>
            </div>
            <div class="member">
                <div class="avatar">RK</div>
                <div class="info">
                    <div class="name">Rudra Kandge</div>
                    <div class="role">Coding</div>
                </div>
            </div>
        </div> 
        <a href="{{ url_for('index') }}" class="btn">Back to Home</a>
    </div>
    {% include '_profile_panel.html' %}
    {% if current_user.is_authenticated %}
    <button class="profile-fab fab-visible" onclick="openProfilePanel()" title="{{ current_user.username }}">
        {{ current_user.username[0] }}
    </button>
    {% endif %}
</body>
</html>
