{% set flash_messages = get_flashed_messages(with_categories=true) %}
{% if flash_messages %}
<div id="flash-container" class="flash-container"></div>

<style>
  .flash-container {
      position: fixed;
      top: 20px;
      right: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      z-index: 2000;
      pointer-events: none;
  }

  .flash-toast {
      position: relative;
      width: clamp(240px, 30vw, 320px);
      padding: 12px 16px 20px 16px;
      border-radius: 10px;
      color: #fff;
      font-weight: 600;
      box-shadow: 0 20px 36px rgba(0,0,0,0.22);
      opacity: 0;
      transform: translateY(16px) scale(0.94);
      transition: transform 0.32s cubic-bezier(0.18, 0.89, 0.36, 1.12), opacity 0.28s ease;
      pointer-events: auto;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      backdrop-filter: blur(6px);
  }

  .flash-toast.show {
      opacity: 1;
      transform: translateY(0) scale(1);
  }

  .flash-toast.closing {
      opacity: 0;
      transform: translateY(-18px) scale(0.92);
  }

  .flash-toast.pulse {
      animation: flash-pulse 340ms ease;
  }

  @keyframes flash-pulse {
      0% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-4px) scale(1.03); }
      100% { transform: translateY(0) scale(1); }
  }

  .flash-toast.error { background: rgba(192, 57, 43, 0.92); }
  .flash-toast.success { background: rgba(39, 174, 96, 0.92); }
  .flash-toast.warning { background: rgba(240, 180, 41, 0.92); color: #07080b; }
  .flash-toast.info { background: rgba(41, 128, 185, 0.92); }

  .flash-message-text {
      flex: 1;
      padding-right: 8px;
      line-height: 1.35;
      letter-spacing: 0.01em;
  }

  .flash-toast button {
      background: transparent;
      border: none;
      color: inherit;
      font-size: 1.15rem;
      cursor: pointer;
      width: 30px;
      height: 30px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      transition: transform 0.2s ease, opacity 0.2s ease, background 0.2s ease, color 0.2s ease;
      box-sizing: border-box;
  }

  .flash-toast button:hover {
      transform: scale(1.05);
      opacity: 1;
      background: #fff;
  }

  .flash-toast.error button:hover { color: #c0392b; }
  .flash-toast.success button:hover { color: #27ae60; }
  .flash-toast.warning button:hover { color: #f1c40f; }
  .flash-toast.info button:hover { color: #2980b9; }

  .flash-progress {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 5px;
      border-radius: 0 0 10px 10px;
      background: rgba(255,255,255,0.25);
      overflow: hidden;
  }

  .flash-progress-bar {
      display: block;
      width: 100%;
      height: 100%;
      background: rgba(255,255,255,0.95);
      transform-origin: left;
      animation: flash-progress var(--flash-duration, 4500ms) linear forwards;
  }

  @keyframes flash-progress {
      to { transform: scaleX(0); }
  }
</style>

<script>
  document.addEventListener('DOMContentLoaded', function () {
    const container = document.getElementById('flash-container');
    if (!container) return;

    const messages = {{ flash_messages|tojson }};
    if (!Array.isArray(messages) || !messages.length) return;

    messages.forEach(([category, text], index) => {
      const toast = document.createElement('div');
      toast.className = `flash-toast ${category || 'info'}`;

      const messageSpan = document.createElement('span');
      messageSpan.className = 'flash-message-text';
      messageSpan.textContent = text;

      const closeBtn = document.createElement('button');
      closeBtn.type = 'button';
      closeBtn.setAttribute('aria-label', 'Dismiss notification');
      closeBtn.textContent = '×';

      const progress = document.createElement('span');
      progress.className = 'flash-progress';
      const progressBar = document.createElement('span');
      progressBar.className = 'flash-progress-bar';

      const duration = 4500 + index * 200;
      toast.style.setProperty('--flash-duration', `${duration}ms`);
      progress.appendChild(progressBar);
      toast.append(messageSpan, closeBtn, progress);
      container.appendChild(toast);

      requestAnimationFrame(() => toast.classList.add('show'));

      let dismissed = false;
      let timeoutId = setTimeout(dismissToast, duration);

      function dismissToast() {
        if (dismissed) return;
        dismissed = true;
        clearTimeout(timeoutId);
        progressBar.style.animationPlayState = 'paused';
        progressBar.style.transform = 'scaleX(0)';
        toast.classList.remove('show');
        toast.classList.add('closing');
        toast.style.pointerEvents = 'none';
        setTimeout(() => toast.remove(), 260);
      }

      closeBtn.addEventListener('click', (event) => {
        event.stopPropagation();
        dismissToast();
      });

      toast.addEventListener('click', (event) => {
        if (event.target === closeBtn) return;
        toast.classList.remove('pulse');
        void toast.offsetWidth;
        toast.classList.add('pulse');
      });

      toast.addEventListener('animationend', (event) => {
        if (event.animationName === 'flash-pulse') {
          toast.classList.remove('pulse');
        }
      });
    });
  });
</script>
{% endif %}
